[package]
name = "schlaues_kind"
version = "0.5.1"
edition = "2024"

[dependencies]
anyhow = "1.0"
eframe = "0.36"
egui = "0.36"
egui_extras = { version = "0.36", features = ["file", "image"] }
image = { version = "0.25", features = ["png"] }
include_optional = "1.1"
log = "0.4"
rand = "0.10"
rodio = "0.22"
rust-i18n = "4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strum = "0.28"
strum_macros = "0.28"
